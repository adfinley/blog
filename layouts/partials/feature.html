{{ $imgs := .Params.images }}
<div class="photo lay-{{ .Params.grid | default "single" }}">
  {{ range $n, $i := .Params.feature }}
  {{ $im := index $imgs $i }}
  <button class="tile t{{ $n }}" data-i="{{ $i }}" aria-label="Open photo"><img src="{{ $im.src | strings.TrimPrefix "/" | relURL }}" alt="{{ $im.alt }}" loading="lazy"></button>
  {{ end }}
  {{ if .Params.gallery }}<span class="badge">📷 Gallery·{{ len $imgs }}</span>{{ end }}
</div>
